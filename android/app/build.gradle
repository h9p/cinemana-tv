plugins { id 'com.android.application' }

android {
    namespace 'com.humam.cinemanatv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.humam.cinemanatv'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    // the web app in ../../www is packaged as the APK's assets
    sourceSets { main { assets.srcDirs = ['../../www'] } }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // replace with your own key before publishing to a store
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
