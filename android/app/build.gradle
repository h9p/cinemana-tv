plugins { id 'com.android.application' }

base { archivesName = 'CinemaHumam' }   // APK file name: CinemaHumam-release.apk

android {
    namespace 'com.humam.cinemahumam'
    compileSdk 35
    defaultConfig {
        applicationId 'com.humam.cinemahumam'
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }
    // the web app in ../../www is packaged as the APK's assets
    sourceSets { main { assets.srcDirs = ['../../www'] } }
    // Fixed release key, so every build can update the installed app in place.
    // CI supplies it from GitHub secrets; without these env vars the build falls back to the debug key.
    def ksFile = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
